<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>Weekly Lineup — screenshot capture (not a site page)</title>
<!-- Not linked from anywhere in the site nav or sitemap — exists purely so
     this one section can be screenshotted in isolation, on the same clean
     static background events.html uses (no animated hero tunnel behind
     it). This markup is an exact copy of the "Weekly lineup" section from
     index.html/events.html (same classes, same heading, no board-mode
     stretching) so it renders pixel-for-pixel like it does embedded on
     those pages. Keep this block in sync whenever that section changes.
     Safe to delete once no longer needed. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;600&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="stylesheet" href="assets/css/style.css?v=20">
</head>
<body>
<div id="gz-veil" aria-hidden="true"></div>
<div class="geo-bg" aria-hidden="true"></div>
<main class="container">
  <section class="reveal eu-section in" id="week">
    <h2><i data-ic="gamepad"></i> Weekly lineup</h2>
    <div class="eu-board">
      <!-- Only rendered in board-mode (see style.css) — a brand mark in the
           top-left corner of the exported screenshot. -->
      <img class="board-logo" src="assets/img/newegg-gamerzone-white.png" alt="Newegg Gamer Zone">
      <div class="eu-top">
        <div class="eu-eyebrow">
          <i data-ic="cal" data-lg></i>
          <div class="eu-eyebrow-textcol">
            <div class="eu-eyebrow-titlerow">
              <h3 class="eu-eyebrow-title" id="eu-eyebrow-title">Gamer Zone <span class="eu-theme-highlight">Weekly Lineup</span></h3>
              <span class="eu-theme-dates" id="eu-eyebrow-dates">&mdash;</span>
            </div>
            <p id="eu-eyebrow-desc">Diamond Bar, CA &middot; Free to play</p>
          </div>
        </div>
      </div>
      <div class="eu-list" id="eu-list"></div>
      <div class="eu-eyebrow eu-location-row eu-location-bottom">
        <i data-ic="pin" data-lg></i>
        <p data-cfg="address"></p>
      </div>
    </div>
  </section>
</main>
<script src="assets/js/main.js?v=20"></script>
<script src="assets/js/event-update.js?v=20"></script>
</body>
</html>
