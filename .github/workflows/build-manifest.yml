name: Rebuild calendar manifest

on:
  push:
    branches: [main]
    paths:
      - "assets/calendar/**"
      - "scripts/update_manifest.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate manifest
        run: python scripts/update_manifest.py
      - name: Commit if changed
        run: |
          git config user.name "gz-bot"
          git config user.email "actions@github.com"
          git add data/calendar-manifest.json
          git diff --cached --quiet || git commit -m "chore: rebuild calendar manifest"
          git push
