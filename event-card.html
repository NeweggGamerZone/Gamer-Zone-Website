<title>Event social card: screenshot capture (not a site page)</title>
<!-- Not linked from anywhere in the site nav or sitemap — same purpose as
     screenshot-monthly-calendar.html/screenshot-weekly-lineup.html, but for
     a single event's social-share graphic instead of a whole month/week
     board. Reserved for "special" events (ones with real, specific extra
     detail on file — a per-event `image` and/or `prizes`/`perks` in
     data/events.json), not generated for every ordinary calendar day.

     Data-driven (unlike screenshot-monthly-calendar.html, which is
     hand-authored on purpose — see that file's own header comment): this
     page fetches the real data/events.json and renders whichever event id
     is asked for, so a future special event only needs its own
     image/prizes/perks fields added to events.json, not a new page.

     Usage:
       event-card.html?id=<event-id>&format=square      (1200x1200, default)
       event-card.html?id=<event-id>&format=horizontal  (1920x1080)
     With no ?id=, defaults to the next upcoming event that actually has
     prizes/perks/an image override defined (falls back to the real SF6
     Saturday Slam id if none is found, since that's the one confirmed
     "special" event on file as of 2026-09-22).

     To capture a real export: open this URL, set the browser viewport to
     EXACTLY 1200x1200 (square) or 1920x1080 (horizontal) — DevTools'
     device toolbar "Responsive" mode with an exact custom size works —
     then screenshot the full viewport. The #card element fills the whole
     viewport at those exact sizes with no page chrome around it, so a
     plain full-viewport screenshot is already a pixel-perfect crop; no
     external cropping tool is required. A future session wiring this into
     scripts/capture-social-images.mjs's existing Playwright+sharp
     pipeline (which already knows how to launch a fixed viewport and
     screenshot a single element) could automate this the same way that
     script already automates the Weekly Lineup board exports — not done
     yet, since which events should auto-export and on what schedule is an
     open question for Eric, not a fully-specified one. -->

<style>
  html,body{margin:0;padding:0;background:#000}
  #card{width:1200px;height:1200px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:70px;box-sizing:border-box}
  body.fmt-horizontal #card{width:1920px;height:1080px;padding:90px;justify-content:center}
  #card .bg-photo{position:absolute;inset:0;background-size:cover;background-position:center 32%}
  /* Square format's scrim is diagonal (dark top-left, where the moved-up
     text now sits; clear bottom-right, where the crowd photo and the new
     card-char graphic show through) -- distinct from the horizontal
     format's own left-to-right scrim below, since the two formats put
     their text in different places. */
  #card .bg-scrim{position:absolute;inset:0;background:linear-gradient(135deg,rgba(6,7,8,.95) 0%,rgba(6,7,8,.86) 26%,rgba(6,7,8,.5) 50%,rgba(6,7,8,.22) 72%,rgba(6,7,8,.5) 100%)}
  body.fmt-horizontal #card .bg-scrim{background:linear-gradient(100deg,rgba(6,7,8,.97) 0%,rgba(6,7,8,.9) 40%,rgba(6,7,8,.4) 70%,rgba(6,7,8,.08) 100%)}
  /* The real fighter-game character cutout (assets/calendar/LineupAssets/
     FighterGames.png, a transparent-background PNG), added 2026-09-22 per
     Eric's request for "a larger graphic" once the square format's text
     moved up to make room for it. Sized down 2026-09-22 (same day) per
     Eric's follow-up -- the first pass rendered it far too large (1010px
     tall, dominating the whole card) -- and extended to the horizontal
     format too, which Eric expected to also show it and didn't. Rendered
     after the scrim but before the real text content in source order, and
     sharing the content's own z-index, so on the rare case they visually
     overlap, the real text (further down in the DOM, same z-index) still
     wins the stacking order and stays legible on top of the character art. */
  /* Flipped horizontally (scaleX(-1)) so he faces left, toward the text/
     prize details, instead of away from them -- the source art faces
     right. Vertically centered (top:50% + translateY(-50%), not bottom-
     anchored) per Eric's "his feet shouldn't touch the bottom, center him
     in Y" follow-up, same day. */
  /* Layered opacity-fade "echo" trail, added 2026-09-22 (Round 15), reusing
     the exact technique the Weekly Lineup board's per-week theme icon
     already uses (.eu-board-icon in style.css / event-update.js): several
     copies of the same image anchored at the same point, each offset a
     little further out with lower opacity/z-index than the last -- reads
     as a motion trail rather than a flat cutout. Round 16 (same day)
     correction, per Eric: the ghosts must NOT shrink -- same height as the
     main character throughout, offset by position only -- and must sit to
     the right of the main character, not the left. Main character keeps
     z-index:1 (ties with .content, which sits later in the DOM and so
     still wins the stacking order per the comment above); all 3 ghost
     copies sit at z-index:0, ordered ghost-3/ghost-2/ghost-1/main in the
     DOM so ghost-1 (closest, most visible) renders above ghost-2 and
     ghost-3 among that shared z-index tier. The translateX offset is the
     OUTER transform function (applied after scaleX(-1) in the composed
     transform), so a positive value shifts right on screen regardless of
     the mirror flip -- scaleX(-1) alone would otherwise invert its sign. */
  #card .card-char{position:absolute;top:50%;z-index:1;pointer-events:none;transform:translateY(-50%) scaleX(-1);filter:drop-shadow(0 20px 46px rgba(0,0,0,.6))}
  /* Square format: main character nudged slightly left (right:40px, was
     right:0) per Eric's "move the square image fighter slightly more to
     the left" -- this also opens up real room to its right for the echo
     trail to sit in, rather than the ghosts pushing off the card's edge. */
  /* Square format graphic bumped 5% larger (560px -> 588px) per Eric's direct
     request, 2026-09-22 (Round 18) -- ghosts grown to match so the echo
     trail stays exactly the main character's own size throughout, per the
     Round 16 rule above. Horizontal format's own 700px override (below) is
     untouched -- this request was scoped to "the square image" only. */
  #card .card-char{right:40px;height:588px}
  #card .card-char-ghost{position:absolute;top:50%;right:40px;height:588px;z-index:0;pointer-events:none}
  #card .card-char-ghost-1{opacity:.32;transform:translate(26px,-50%) scaleX(-1)}
  #card .card-char-ghost-2{opacity:.16;transform:translate(48px,-50%) scaleX(-1)}
  #card .card-char-ghost-3{opacity:.07;transform:translate(68px,-50%) scaleX(-1)}
  /* Horizontal format: per Eric, the character moves off the right edge
     and into the middle of the layout's own empty space instead -- the
     content column (.content, max-width:900px) sits against the left
     padding, so the genuinely empty area runs from roughly the content's
     right edge to the card's own right padding. Anchored via left:74% +
     translate(-50%,...) (a centered anchor, not a right-edge one) so the
     character and its whole echo trail sit centered in that gap rather
     than pinned to the card's outer edge. */
  body.fmt-horizontal #card .card-char{height:700px;left:74%;right:auto;top:50%;transform:translate(-50%,-50%) scaleX(-1)}
  body.fmt-horizontal #card .card-char-ghost{left:74%;right:auto;top:50%;height:700px}
  body.fmt-horizontal #card .card-char-ghost-1{transform:translate(calc(-50% + 40px),-50%) scaleX(-1)}
  body.fmt-horizontal #card .card-char-ghost-2{transform:translate(calc(-50% + 74px),-50%) scaleX(-1)}
  body.fmt-horizontal #card .card-char-ghost-3{transform:translate(calc(-50% + 104px),-50%) scaleX(-1)}
  #card .content{position:relative;z-index:1;max-width:1020px}
  body:not(.fmt-horizontal) #card .content{max-width:600px}
  body.fmt-horizontal #card .content{max-width:900px}
  /* Round 26: per Eric's direct follow-up -- both the top-right (Round 23)
     and bottom-right/enlarged (Round 25) placements read as disconnected
     from the card's own text block ("weird to have the logo above on the
     right"). Moved into the normal content flow, stacked directly above
     the type tag ("MAJOR"/"NEWEGG EVENT"/etc.), left-aligned with

     now sharing vertical space with the tag/title/subtitle stack, not
     occupying an empty corner on its own. */
  #card .brand-row{display:flex;align-items:center;gap:14px;margin:0 0 16px}
  /* Round 28: per Eric's direct "make the Gamer Zone logo on the other

     tag regardless of size. */
  #card .brand-row .nlogo-img{height:126px;width:auto;display:block}
  body.fmt-horizontal #card .brand-row .nlogo-img{height:144px}
  #card .tag{font-size:22px;padding:.5rem 1.1rem}
  #card h1{font-family:var(--head);font-weight:800;font-size:64px;line-height:1.05;text-transform:uppercase;color:#fff;margin:22px 0 10px;text-shadow:0 4px 24px rgba(0,0,0,.8)}
  body:not(.fmt-horizontal) #card h1{font-size:52px}
  body.fmt-horizontal #card h1{font-size:56px}
  #card .cd-sub{font-family:var(--head);font-weight:600;font-size:28px;color:var(--ne-blue-text);margin:0 0 18px;text-shadow:0 2px 14px rgba(0,0,0,.75)}
  body.fmt-horizontal #card .cd-sub{font-size:24px}

  #card .cd-meta-item .ic{width:32px;height:32px;color:var(--ne-orange);flex:none}
  #card .prize-heading{font-size:20px;margin:6px 0 16px}
  #card .prize-table{grid-template-columns:repeat(4,1fr);gap:16px;margin:0 0 22px}
  /* Round 18: square format kept at 2 columns (NOT switched to 4) after a
     real bug was found and rejected -- trying 4 columns at this content's
     enlarged font sizes triggered a classic CSS Grid "blowout": a `1fr`
     track's automatic minimum is its content's own min-content width, not
     0, so when 4 columns' worth of badge+$-amount content couldn't
     realistically fit an equal 141px share of the 600px content column,
     every track grew to fit its own content instead -- and the grid's
     total computed width (verified live at ~1019px) silently overflowed

     to its own content length" failure this project's container/sizing
     rules already warn against. 2 columns' own 294px-wide track (verified
     live) comfortably fits this content's real min-content width with no
     blowout, so it's the one actually safe to use at this column width. */
  body:not(.fmt-horizontal) #card .prize-table{grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
  /* Higher-opacity fill than the shared style.css default (rgba(255,255,255,.06)
     bg / .16 border) -- per Eric's "make the prize areas higher opacity"
     request, 2026-09-22 (Round 15). Page-scoped override, same pattern as
     every other #card-prefixed rule in this file. */
  /* Round 19, same day: the numbered place badge ("1"/"2"/"3"/"4" circle)
     is removed entirely -- per Eric, it read as conflicting with the
     ordinal already spelled out in the place-label text right next to it
     ("1ST PLACE"), i.e. the same information shown twice in two different
     shapes. Supersedes Round 18's row layout (badge left, amount+label
     right) with a plain centered column: just the $ amount and the place
     label, stacked and centered, filling the tile now that the badge no
     longer needs its own dedicated space. justify-content:center centers
     the pair vertically within the tile's own 4:3-derived height (see the
     aspect-ratio comment below) now that there's no badge dictating a

  #card .prize-row{flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px 22px;border-radius:16px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.34)}
  /* Square format only: near-square tiles, per Eric's "I want square nodes
     on the square graphic version, like how the horizontal version has
     square nodes." A literal 1:1 was tried first and rejected after
     rendering it: at a 294px-wide 2-column track, a true square tile
     forces the whole 4-tile table to ~600px tall, which pushed the perk
     chips and the footer line completely below the card's own 1200px
     bottom edge -- real clipped content, confirmed via a live
     getBoundingClientRect check, not just a hunch. The horizontal format's
     own tiles aren't a literal 1:1 either (measured ~1.12-1.27:1 live) --

     near-square proportion (Eric's actual reference point) while leaving
     real, verified room for everything below the table. Applied to
     `.prize-row` itself, a CSS Grid item (not a plain block), so it still
     gets a real content-based automatic minimum size and won't silently
     clip if content ever needs more room than this ratio allows. */
  /* Round 21: shrunk further, per Eric ("make the nodes a little smaller on
     the square version, still a bit too much white space"). Measured the
     real content height live before touching the ratio: at the 294px tile
     width this 2-column grid produces, the amount+label pair only needs
     ~132px, plus the tile's own 20px top/bottom padding = ~172px -- the
     prior 4:3 ratio forced 220.5px, leaving ~48px of real dead space per
     tile, confirmed via getBoundingClientRect, not eyeballed. 3:2 (1.5:1)
     brings that down to 196px -- still reads as a squarish tile (not a
     thin bar), just tighter around its real content; a ratio closer to
     content-hugging (~1.7:1) was available but would have left almost no
     breathing room at all. Re-verify against real content height again if
     the amount/label font sizes or padding ever change. */
  body:not(.fmt-horizontal) #card .prize-row{aspect-ratio:3/2}
  /* Prize $ amount sized up again 2026-09-22 (Round 18), on top of Round
     17's bump, per Eric's direct "make everything within those tile nodes
     to be larger." Round 19 removed the `.place` badge circle entirely

  #card .prize-row .amt{font-size:58px;text-align:center}
  /* Round 19: the amount+label pair no longer sits in a bare wrapper
     `<span>` next to a `.place` badge -- with the badge gone, `.amt` and
     `.place-label` are direct children of `.prize-row` itself, which is
     already the centered flex column set above. */
  /* A real contrast gap found and fixed while verifying Round 17's sizing
     bump, not introduced by it: at under-24px sizes, the shared style.css
     --ink-dim color only measured 5.0-6.1:1 against this card's real
     rendered background (rgba(255,255,255,.16) over the dark scrim/photo),
     sampled live via Puppeteer + pixel contrast math -- short of this
     project's 7:1 AAA floor. Given a lighter, still-visually-secondary
     tint (#D0D5E0, distinct from the .amt line's pure white) that clears
     7.61:1 worst-case across both formats, confirmed via the same live
     pixel-sampling method -- re-verify this if the color ever changes
     again, per the same method. Scoped to this page only -- the shared
     style.css .place-label default (used by calendar.js's live panel, on
     a different, already-verified background) is untouched. */
  /* Nudged one step lighter again in Round 18 (#D0D5E0 -> #DCE0E8): the
     taller 4:3 tile moved this label to a new Y position that sampled a
     real 5.98:1 against the square format's real rendered background --
     under the 7:1 floor -- confirmed live, same pixel-sampling method as
     every prior color pick for this element. Re-verify again if the tile
     shape or this color ever changes. */
  /* Round 19: centered under the amount (the tile's new column layout),
     and kept to one line where there's room -- per Eric's "ensure the
     number and then place fits in the same line" ("1ST PLACE" shouldn't
     itself wrap into "1ST"/"PLACE" on two lines). Square format's 2-column

     format's 4-column tiles are narrower per-column (see the prize-table

     "horizontal has multiple lines" flagged that as an acceptable
     difference between the two formats, so nowrap is scoped to square
     only rather than forced everywhere (which would risk real overflow
     on the narrower horizontal columns instead). */
  /* Round 19: pushed to pure white -- two lighter tints (#DCE0E8, #E9ECF1)
     both still measured under the 7:1 AAA floor against this tile's real
     rendered background at its new centered position (6.21:1, then
     6.94:1) once the badge was removed and the label re-centered under the
     amount. Direct pixel-sampling found the worst real background this
     label can land on samples at ~8.19:1 even against pure white -- this is
     already the ceiling available at this position, not an arbitrary
     choice; a distinct, slightly-dimmer tint from the .amt line isn't
     achievable here without falling back under the floor. Re-verify again
     if this tile's layout, background photo, or scrim ever changes. */
  /* Round 20: per Eric ("make the 1st 2nd 3rd place more readable, maybe a
     different color like orange"), re-verified live via the same Puppeteer
     + pixel-sampling method and tried a real orange ramp against this
     tile's actual rendered background in both formats -- the site's own
     --ne-orange (#FA9D28) only reaches 3.82:1 worst-case (square tile 0,
     the tile with the brightest real sampled background), and every
     candidate saturated enough to clearly read as "orange" tops out around

     normal-size text (this label is 21px, not bold, so it doesn't qualify

     cream-orange tint, distinctly warmer than the .amt line's pure white

     7:1 with real margin (7.50:1 worst-case square, 11.05:1 horizontal).

     tile position without falling under the floor -- same conclusion
     Round 19 reached for this same element, just re-confirmed against a
     warm hue instead of a neutral one. Re-verify again if this tile's
     layout, background photo, or scrim ever changes. */
  #card .prize-row .place-label{font-size:21px;color:#FFF5E6;text-align:center}
  body:not(.fmt-horizontal) #card .prize-row .place-label{white-space:nowrap}
  /* 2026-10-01: a named-giveaway variant of the prize tile (see prizeHTML's
     own comment below), for an event whose "prizes" are a list of real
     named items/perks (Fantastech 2's "MSI 24in 144Hz Monitors", "Free
     Pizza") rather than a dollar-amount bracket payout. Reuses the exact

  #card .prize-row .prize-label-only{font-size:30px;line-height:1.15;text-align:center;color:#fff;white-space:normal}

     the shared GZ_ICONS set (see main.js) the same way every other orange
     icon badge on this site already does (.amb-class-icon, the tier
     pillars, etc.) rather than inventing a new icon system or using
     literal multi-color emoji. Rendered above the label text (.prize-row
     already stacks as a centered column, see that rule above), sized up
     from the shared style.css default since this card's text is much
     larger than the live calendar panel's own copy of this tile. */
  #card .prize-row-label .ic.prize-icon{width:40px;height:40px;color:var(--ne-orange);margin-bottom:8px;flex:none}
  /* The pumpkin/decorative-image slot (data/events.json's own `decorImage`
     field) -- generic and reusable by any future event, not hardcoded to
     this one image. Unlike .card-char (gated behind `cardChar`, built
     specifically for the SF6 fighter-game cutout with its own echo trail),

     the square format's bottom-right, the content column's own empty space

  #card .decor-img{position:absolute;width:auto;z-index:0;pointer-events:none;filter:drop-shadow(0 16px 36px rgba(0,0,0,.55))}
  /* Square format: centered in the card's own empty space (the area right
     of the text/tile column, which ends at x=670 -- .content's
     max-width:600px + 70px left padding), the same "centered in the empty
     space" placement Round 15 established for the horizontal format's
     character art.
     2026-10-02, per Eric: the decorative image swapped from Pumpkins.png

     a smiley-face screen). The old 620px-tall/78%-centered sizing was
     tuned for the narrow portrait image specifically -- at the new image's
     wider aspect ratio, that same height would render ~800px wide and
     collide with the text column, confirmed by the math before shipping
     (620 * 1427/1102 ~= 803px, vs. only ~460px of real clearance between

     verified fit instead: height:310px -> ~400px wide at this image's

  /* Perk tags (Free Pizza Lunch / Raffle Prizes) sized up 2026-09-22
     (Round 17), per Eric's direct "make the node tags... larger" request. */
  #card .perk-chip{font-size:28px;padding:.75rem 1.5rem}
  /* 2026-10-02 (same day, follow-up round): the square-format-only
     "label prizes + decorImage" layout (see useLabelSquareLayout in the
     script below) -- per Eric's "make the nodes stretch in a row of 4x1
     on the bottom of the square one, with the computer graphic larger and
     next to the event description." Scoped narrowly to this one new
     layout branch; the original layout's own CSS above (used by every

  #card .ll-text{flex:1;min-width:0}

     smaller" -- scoped to this layout's text column only (the original
     bottom-anchored layout's .cd-sub, used by every other event, is
     untouched). Paired with a shortened subtitle string in
     data/events.json itself (Eric's separate "shorter version" ask), so

  /* 2026-10-02 (same-day follow-up), per Eric's "make the... body text on

  body:not(.fmt-horizontal) #card .ll-text .cd-sub{font-size:24px}

     Range.getClientRects(), not guessed): 39px is the largest one-line
     size, 40px wraps. 38px ships with a small safety margin, the same
     convention this project's other binary-searched text sizes use
     (e.g. Round 38's closure-row font-size). Scoped to this layout's
     text column only -- the original layout's shared h1 size (52px) is
     untouched for every other event. */
  /* 2026-10-02 (same-day follow-up), per Eric's "make the... body text on
     the left all bigger" -- re-binary-searched live against the text
     column's real (now narrower at ~432px, since the computer graphic also
     grew this round) width: the old one-line threshold (38px @ 476px) no
     longer applies once the graphic's own size changed, and the real new
     one-line max at this width is only 36px -- smaller than what already
     shipped, the opposite of "bigger". 42px ships instead, wrapping to 2
     lines -- a real, deliberate tradeoff disclosed here rather than
     silently kept at the old constraint: Eric only asked for bigger text
     this round, not a renewed one-line guarantee, and a 2-line title reads
     fine at this size with the row's own height already flexing to fit it. */
  body:not(.fmt-horizontal) #card .ll-text h1{font-size:42px}
  /* Overrides the base .decor-img's position:absolute/left/top/transform
     (tuned for the old bottom-right-corner placement) so the image
     becomes a normal, larger, static flex item sitting next to the text
     column instead of floating in its own empty corner -- directly
     addressing "the computer graphic larger and next to the event
     description." Needs the same body:not(.fmt-horizontal) specificity
     as the base square-format .decor-img rule above to reliably win. */
  /* 2026-10-02 (same-day follow-up), per Eric's "make the computer... bigger"
     -- 420px -> 460px. A larger jump (tried 520px first) made the image's
     own real width balloon enough (aspect ratio ~1.29:1) to crush the text
     column down to ~347px, forcing the title to wrap and the subtitle to
     ~4 lines -- confirmed via a live measurement, not assumed -- which
     fought the same round's "bigger left text" ask instead of complementing
     it. 460px is a real, verified compromise: still a visible increase, but
     leaves the text column close to its old ~476px width. */
  body:not(.fmt-horizontal) #card .ll-top{gap:32px}
  body:not(.fmt-horizontal) #card .decor-img-inline{position:static;left:auto;top:auto;transform:none;height:460px;width:auto;flex:none;margin-left:auto}
  /* Pushed to the bottom of #card's own flex column via margin-top:auto
     (a flex item's margin-top:auto consumes all remaining free space
     above it) -- this is what makes the prize row sit at "the bottom of
     the square one" regardless of how tall the text column above it
     happens to be. A full-width block (no max-width cap, unlike
     .content) so the 4 tiles can genuinely stretch across the card's
     full ~1060px inner width, per Eric's "stretch in a row of 4x1". */
  /* position:relative;z-index:1, matching .content's own treatment --
     without it, these two plain static siblings (outside .content, for
     the useLabelSquareLayout branch) paint in the lower "static in-flow
     block" stacking tier, which sits BELOW the positioned .bg-photo/
     .bg-scrim layers (position:absolute, z-index:auto) regardless of DOM
     order -- confirmed live via direct pixel sampling (every sampled
     point in this region came back near-black, i.e. nothing was actually
     painting there despite getComputedStyle reporting opacity:1/
     visibility:visible). Promoting both to the same z-index:1 tier
     .content already uses puts them back in normal DOM-order stacking,
     above the background layers. */
  /* 2026-10-02 (same-day follow-up), per Eric's "too much empty space in
     that middle of the screenshot... move the perks up a bit" -- the old
     margin-top:auto pinned this section to the card's very bottom
     regardless of how short the top row was, which is what created that
     large empty gap. Replaced with a fixed margin so the prize row sits a
     set distance below the top row instead of always at the floor; any
     leftover vertical space now falls below the footer (the bottom of the
     card) rather than in the middle, which reads far less like a mistake.
     Re-measure live if the top row's or prize table's own height changes
     again (e.g. a future font/graphic size change). */
  #card .ll-prize-section{margin-top:70px;width:100%;position:relative;z-index:1}
  /* Back to 4 columns specifically for this layout's prize row -- the
     shared square-format override above (body:not(.fmt-horizontal) #card
     .prize-table{grid-template-columns:repeat(2,1fr)...}) exists because
     the *original* layout's prize table sits inside the narrow 600px
     .content column, where 4 columns would blow out past its own width
     (see Round 18's own documented rejection of exactly that). This
     table instead sits inside the full-width .ll-prize-section, so 4
     columns fits safely -- same specificity as that 2-column override,
     defined later in the stylesheet so it wins for this table only. */
  /* minmax(0,1fr), not a bare 1fr -- a bare 1fr track's automatic minimum
     is its content's own min-content width (not 0), which silently blew
     this 4-column row out to ~1245px of real content width against only
     a 1060px box (confirmed live via getBoundingClientRect() before this
     fix, tiles spilling ~115px past the card's own right edge) -- the
     exact CSS Grid blowout bug Round 18 already documented and fixed the
     same way for this page's other prize-table usage. minmax(0,1fr)
     lets each track actually shrink to its equal 1/4 share; the tile's
     own text wrapping (already white-space:normal) absorbs the rest. */
  body:not(.fmt-horizontal) #card .ll-prize-table{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0 0 8px}
  /* 2026-10-02 (same-day follow-up), per Eric's "make the perks a tad bit
     taller" -- a real min-height floor (not a forced aspect-ratio) on just
     this layout's own prize tiles, since they're already a CSS Grid item
     and already fine content-wise; this only needs more room, not a ratio.
     Scoped to .ll-prize-table specifically so SF6 Saturday Slam's own
     square card (a different layout, different prize-table class) is
     unaffected. */
  body:not(.fmt-horizontal) #card .ll-prize-table .prize-row{min-height:210px;padding:26px 22px}
  #card .ll-footer{margin-top:16px;position:relative;z-index:1}
  /* A page-scoped size for the emoji-fallback prize icon (see iconHTML's
     own comment below) to match the existing SVG icon case's own
     page-scoped 40px size (#card .prize-row-label .ic.prize-icon above)
     -- the shared style.css .prize-icon-emoji default (1.6rem) is sized
     for the live calendar panel's much smaller text, not this card. */
  #card .prize-row-label .prize-icon-emoji{font-size:34px;line-height:40px;margin-bottom:8px}
  #card .footer-line{margin-top:24px;font-family:var(--eu-body);font-size:20px;color:var(--ink-dim)}
  #err{color:#fff;font-family:var(--eu-body);padding:2rem}
</style>
</head>
<body>
<div id="card" aria-hidden="false">
  <div id="err"></div>
</div>
<script src="assets/js/main.js?v=109"></script>
<script>
(async function(){
  const qs = new URLSearchParams(location.search);
  const fmt = (qs.get('format') || 'square').toLowerCase() === 'horizontal' ? 'horizontal' : 'square';
  document.body.classList.toggle('fmt-horizontal', fmt === 'horizontal');
  const card = document.getElementById('card');

  let data = { events: [] };
  try { data = await (await fetch('data/events.json')).json(); } catch {}
  const events = data.events || [];

  const today = (window.GZ && GZ.todayISO) ? GZ.todayISO() : new Date().toISOString().slice(0,10);
  let ev = null;
  const wantId = qs.get('id');
  if (wantId) ev = events.find(e => e.id === wantId) || null;
  if (!ev) {
    // Default: the next upcoming event that actually has real extra detail
    // on file (an image override and/or prizes/perks) -- "special" events
    // only, per Eric's own framing, not just whatever's chronologically next.
    ev = events
      .filter(e => e.date >= today && (e.image || (e.prizes && e.prizes.length) || (e.perks && e.perks.length)))
      .sort((a,b) => a.date < b.date ? -1 : 1)[0]
      || events.find(e => e.id === 'street-fighter-saturday-slam-2026-09-26')
      || null;
  }

  if (!ev) {
    card.innerHTML = '<div id="err">No matching event found. Pass ?id=&lt;event-id&gt; from data/events.json.</div>';
    return;
  }

  const TYPE = { 'theme-night': 'Theme Day', tournament: 'Tournament', vendor: 'Vendor', edu: 'Training', community: 'Community', major: 'Major', 'newegg-event': 'Newegg Event', 'car-meet': 'Car Meet', 'lan-party': 'LAN Party' };
  const TYPE_COLOR = { 'theme-night': 'cal-theme', tournament: 'cal-major', vendor: 'cal-amb', edu: 'cal-edu', community: 'cal-amb', major: 'cal-major', 'newegg-event': 'cal-major', 'car-meet': 'cal-major', 'lan-party': 'cal-major' };
  const bgUrl = (fmt === 'horizontal' && ev.imageHD) ? ev.imageHD : (ev.image || 'assets/calendar/BGAssets/tournament-major-bg-blurred.jpg');
  // 2026-10-02 (same-day follow-up), per Eric's "write out Saturday" --
  // the weekday now spells out in full ("Saturday, Oct 3") rather than
  // abbreviating ("Sat, Oct 3").
  const pretty = dt => new Date(dt + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  const esc = (window.GZ && GZ.esc) ? GZ.esc : (s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));

  // "${ord} Place" (e.g. "1st Place") to match calendar.js's own prizeBlock()
  // -- this template had drifted to a bare ordinal with no "Place" word;
  // fixed 2026-09-22 (Round 15) per Eric's "write out 1st place and place
  // for each one".
  const ord = n => (n === 1 ? '1st' : n === 2 ? '2nd' : n === 3 ? '3rd' : `${n}th`);
  // Round 19: dropped the numbered place-badge span entirely, per Eric --
  // showing "1"/"2"/"3"/"4" in a circle right next to "1ST PLACE" spelled
  // out the same ordinal twice in two different shapes, which read as
  // conflicting rather than reinforcing. Each tile is now just the $
  // amount and the place label, centered (styled via the .prize-row/
  // .amt/.place-label rules above).
  // 2026-10-01: a second `prizes` item shape, `{label}`, added alongside the
  // existing `{place,amount}` bracket-payout shape -- for an event whose
  // prizing is a set of named giveaways/perks (Fantastech 2's "MSI 24in
  // 144Hz Monitors", "Free Pizza") rather than a dollar bracket. Reuses the
  // same .prize-row tile (just centered label text, see the CSS comment
  // above) instead of a second component, and `ev.prizeHeading` lets each
  // event override the "Bracket Prizing" default heading, which only
  // actually fits a real bracket tournament.
  // 2026-10-02 (same day, follow-up): per Eric's "use a pizza emoji, not a
  // triangle" -- `icon` can be either a GZ_ICONS name (rendered as the
  // existing flat-orange SVG, e.g. monitor/keyboard/gamepad) or a literal
  // emoji character (rendered as plain text instead) when the value isn't
  // a known icon name. Mirrored in calendar.js's own identical helper so
  // the live calendar panel and this export stay in sync.
  const iconHTML = name => !name ? '' : (GZ_ICONS[name] ? GZ.icon(name, 'ic prize-icon') : `<span class="prize-icon-emoji" aria-hidden="true">${esc(name)}</span>`);
  const prizeTile = p => p.label
    ? `<div class="prize-row prize-row-label">${iconHTML(p.icon)}<span class="amt prize-label-only">${esc(p.label)}</span></div>`
    : `<div class="prize-row"><span class="amt">$${p.amount}</span><span class="place-label">${ord(p.place)} Place</span></div>`;
  const prizeHTML = (ev.prizes && ev.prizes.length)
    ? `<div class="prize-heading">${esc(ev.prizeHeading || 'Bracket Prizing')}</div><div class="prize-table">${ev.prizes.map(prizeTile).join('')}</div>`
    : '';
  // A real overflow bug found while building Fantastech 2's card, fixed
  // before shipping rather than after: an event using the new label-based
  // prize tiles above already surfaces its giveaways/perks as part of that
  // 4-tile grid, so also rendering the separate perk-chip row (data/
  // events.json's own `perks` field, built for a different purpose --
  // supplementing a $-amount bracket table, see SF6 Saturday Slam) is both
  // redundant and, confirmed via a live screenshot, pushes real content
  // (the 3rd perk chip and the whole footer line) past this card's fixed
  // 1200px bottom edge. Scoped narrowly to label-prize events only -- SF6's
  // own bracket-table + perk-chip combination (verified to fit back in
  // Round 17) is completely unchanged.
  const hasLabelPrizes = ev.prizes && ev.prizes.some(p => p.label);
  const perkHTML = (!hasLabelPrizes && ev.perks && ev.perks.length) ? ev.perks.map(p => `<div class="perk-chip">${esc(p)}</div>`).join('') : '';
  // A generic, event-opt-in decorative image (data/events.json's own
  // `decorImage` field) -- e.g. the pumpkin stack for Fantastech 2, per
  // Eric's direct request. Deliberately not hardcoded to one image/event
  // the way .card-char/CHAR_SRC above is (that one carries its own
  // fighting-game-specific echo-trail treatment) -- this is a plain single
  // image, reusable by any future event that wants one.
  const decorHTML = ev.decorImage ? `<img class="decor-img" src="${esc(ev.decorImage)}" alt="" aria-hidden="true">` : '';

  // The real fighter-game character cutout -- rendered in both formats
  // (see the .card-char CSS comment above for the 2026-09-22 sizing
  // history); each format's own CSS rule controls its size/position.
  // Reused as-is from the shared LineupAssets folder, not a one-off copy
  // made just for this card. 3 lower-opacity "ghost" copies of the same
  // image render underneath the main one (see the CSS comment above) --
  // the same echo/fade-trail technique the Weekly Lineup board's per-week
  // theme icon already uses, added 2026-09-22 (Round 15) per Eric's request.
  // Round 22.5 (2026-09-29): gated behind ev.cardChar -- this specific
  // cutout (FighterGames.png) is fighting-game-themed art, so it only
  // renders for an event that explicitly opts in (currently just SF6
  // Saturday Slam). Without this gate it was rendering unconditionally on
  // every event card, including October's FantasTech 2/Car Club/Halloween
  // cards, which have nothing to do with a fighting game.
  const CHAR_SRC = 'assets/calendar/LineupAssets/FighterGames.png';
  const charHTML = ev.cardChar ? `
    <img class="card-char-ghost card-char-ghost-3" src="${CHAR_SRC}" alt="" aria-hidden="true">
    <img class="card-char-ghost card-char-ghost-2" src="${CHAR_SRC}" alt="" aria-hidden="true">
    <img class="card-char-ghost card-char-ghost-1" src="${CHAR_SRC}" alt="" aria-hidden="true">
    <img class="card-char" src="${CHAR_SRC}" alt="" aria-hidden="true">` : '';

  const brandRowHTML = `<div class="brand-row"><img class="nlogo-img" src="assets/img/newegg-gamerzone-clean.png" alt="Newegg Gamer Zone"></div>`;
  const tagHTML = `<span class="tag ${TYPE_COLOR[ev.type] || 'cal-major'}">${esc(TYPE[ev.type] || ev.type || 'Event')}</span>`;
  const metaHTML = `<div class="cd-meta">
        <span class="cd-meta-item"><i data-ic="cal"></i>${pretty(ev.date)}</span>
        ${ev.time ? `<span class="cd-meta-item"><i data-ic="clock"></i>${esc(ev.time)}</span>` : ''}
      </div>`;

  // 2026-10-02 (same day, follow-up round), per Eric: "make the nodes
  // stretch in a row of 4x1 on the bottom of the square one, with the
  // computer graphic larger and next to the event description." A second,
  // square-format-only layout -- only for an event that has BOTH a
  // decorImage (currently just Fantastech 2's "smiling computer") AND
  // label-style prizes, i.e. exactly the card this request is about, not
  // a generic trigger that could silently change SF6 Saturday Slam's own
  // bracket-table/fighter-cutout square card, which keeps the original
  // layout below completely unchanged. Horizontal format is untouched too
  // -- Eric's request was scoped to "the square one" specifically, and
  // horizontal's existing 4-column prize-table + bottom-right decor image
  // already reads the way this request asks for.
  const useLabelSquareLayout = !!(ev.decorImage && hasLabelPrizes && fmt === 'square');

  if (useLabelSquareLayout) {
    card.innerHTML = `
      <div class="bg-photo" style="background-image:url('${bgUrl}')" aria-hidden="true"></div>
      <div class="bg-scrim" aria-hidden="true"></div>
      <div class="content ll-content">
        <div class="ll-top">
          <div class="ll-text">
            ${brandRowHTML}
            ${tagHTML}
            <h1>${esc(ev.title)}</h1>
            ${ev.subtitle ? `<p class="cd-sub">${esc(ev.subtitle)}</p>` : ''}
            ${metaHTML}
          </div>
          <img class="decor-img decor-img-inline" src="${esc(ev.decorImage)}" alt="" aria-hidden="true">
        </div>
      </div>
      <div class="ll-prize-section">
        <div class="prize-heading">${esc(ev.prizeHeading || 'Prizes & Perks')}</div>
        <div class="prize-table ll-prize-table">${ev.prizes.map(prizeTile).join('')}</div>
      </div>
      <div class="footer-line ll-footer">Free to enter the Zone · Walk-ins welcome</div>`;
  } else {
    card.innerHTML = `
      <div class="bg-photo" style="background-image:url('${bgUrl}')" aria-hidden="true"></div>
      <div class="bg-scrim" aria-hidden="true"></div>
      ${charHTML}
      ${decorHTML}
      <div class="content">
        ${brandRowHTML}
        ${tagHTML}
        <h1>${esc(ev.title)}</h1>
        ${ev.subtitle ? `<p class="cd-sub">${esc(ev.subtitle)}</p>` : ''}
        ${metaHTML}
        ${prizeHTML}
        ${perkHTML}
        <div class="footer-line">Free to enter the Zone · Walk-ins welcome</div>
      </div>`;
  }
  if (window.injectIcons) injectIcons(card);
  else if (window.GZ && GZ.injectIcons) GZ.injectIcons(card);
})();
</script>
</body>
</html>
