<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>Event social card: screenshot capture (not a site page)</title>
<!-- Not linked from anywhere in the site nav or sitemap — same purpose as
     screenshot-monthly-calendar.html/screenshot-weekly-lineup.html, but for
     a single event's social-share graphic instead of a whole month/week
     board. Reserved for "special" events (ones with real, specific extra
     detail on file — a per-event `image` and/or `prizes`/`perks` in
     data/events.json), not generated for every ordinary calendar day.

     Data-driven (unlike screenshot-monthly-calendar.html, which is
     hand-authored on purpose — see that file's own header comment): this
     page fetches the real data/events.json and renders whichever event id
     is asked for, so a future special event only needs its own
     image/prizes/perks fields added to events.json, not a new page.

     Usage:
       event-card.html?id=<event-id>&format=square      (1200x1200, default)
       event-card.html?id=<event-id>&format=horizontal  (1920x1080)
     With no ?id=, defaults to the next upcoming event that actually has
     prizes/perks/an image override defined (falls back to the real SF6
     Saturday Slam id if none is found, since that's the one confirmed
     "special" event on file as of 2026-09-22).

     To capture a real export: open this URL, set the browser viewport to
     EXACTLY 1200x1200 (square) or 1920x1080 (horizontal) — DevTools'
     device toolbar "Responsive" mode with an exact custom size works —
     then screenshot the full viewport. The #card element fills the whole
     viewport at those exact sizes with no page chrome around it, so a
     plain full-viewport screenshot is already a pixel-perfect crop; no
     external cropping tool is required. A future session wiring this into
     scripts/capture-social-images.mjs's existing Playwright+sharp
     pipeline (which already knows how to launch a fixed viewport and
     screenshot a single element) could automate this the same way that
     script already automates the Weekly Lineup board exports — not done
     yet, since which events should auto-export and on what schedule is an
     open question for Eric, not a fully-specified one. -->
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="stylesheet" href="assets/css/style.css?v=102">
<style>
  html,body{margin:0;padding:0;background:#000}
  #card{width:1200px;height:1200px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;padding:70px;box-sizing:border-box}
  body.fmt-horizontal #card{width:1920px;height:1080px;padding:90px;justify-content:center}
  #card .bg-photo{position:absolute;inset:0;background-size:cover;background-position:center 32%}
  /* Square format's scrim is diagonal (dark top-left, where the moved-up
     text now sits; clear bottom-right, where the crowd photo and the new
     card-char graphic show through) -- distinct from the horizontal
     format's own left-to-right scrim below, since the two formats put
     their text in different places. */
  #card .bg-scrim{position:absolute;inset:0;background:linear-gradient(135deg,rgba(6,7,8,.95) 0%,rgba(6,7,8,.86) 26%,rgba(6,7,8,.5) 50%,rgba(6,7,8,.22) 72%,rgba(6,7,8,.5) 100%)}
  body.fmt-horizontal #card .bg-scrim{background:linear-gradient(100deg,rgba(6,7,8,.97) 0%,rgba(6,7,8,.9) 40%,rgba(6,7,8,.4) 70%,rgba(6,7,8,.08) 100%)}
  /* The real fighter-game character cutout (assets/calendar/LineupAssets/
     FighterGames.png, a transparent-background PNG), added 2026-09-22 per
     Eric's request for "a larger graphic" once the square format's text
     moved up to make room for it. Sized down 2026-09-22 (same day) per
     Eric's follow-up -- the first pass rendered it far too large (1010px
     tall, dominating the whole card) -- and extended to the horizontal
     format too, which Eric expected to also show it and didn't. Rendered
     after the scrim but before the real text content in source order, and
     sharing the content's own z-index, so on the rare case they visually
     overlap, the real text (further down in the DOM, same z-index) still
     wins the stacking order and stays legible on top of the character art. */
  /* Flipped horizontally (scaleX(-1)) so he faces left, toward the text/
     prize details, instead of away from them -- the source art faces
     right. Vertically centered (top:50% + translateY(-50%), not bottom-
     anchored) per Eric's "his feet shouldn't touch the bottom, center him
     in Y" follow-up, same day. */
  /* Layered opacity-fade "echo" trail, added 2026-09-22 (Round 15), reusing
     the exact technique the Weekly Lineup board's per-week theme icon
     already uses (.eu-board-icon in style.css / event-update.js): several
     copies of the same image anchored at the same point, each offset a
     little further out with lower opacity/z-index than the last -- reads
     as a motion trail rather than a flat cutout. Round 16 (same day)
     correction, per Eric: the ghosts must NOT shrink -- same height as the
     main character throughout, offset by position only -- and must sit to
     the right of the main character, not the left. Main character keeps
     z-index:1 (ties with .content, which sits later in the DOM and so
     still wins the stacking order per the comment above); all 3 ghost
     copies sit at z-index:0, ordered ghost-3/ghost-2/ghost-1/main in the
     DOM so ghost-1 (closest, most visible) renders above ghost-2 and
     ghost-3 among that shared z-index tier. The translateX offset is the
     OUTER transform function (applied after scaleX(-1) in the composed
     transform), so a positive value shifts right on screen regardless of
     the mirror flip -- scaleX(-1) alone would otherwise invert its sign. */
  #card .card-char{position:absolute;top:50%;z-index:1;pointer-events:none;transform:translateY(-50%) scaleX(-1);filter:drop-shadow(0 20px 46px rgba(0,0,0,.6))}
  /* Square format: main character nudged slightly left (right:40px, was
     right:0) per Eric's "move the square image fighter slightly more to
     the left" -- this also opens up real room to its right for the echo
     trail to sit in, rather than the ghosts pushing off the card's edge. */
  #card .card-char{right:40px;height:560px}
  #card .card-char-ghost{position:absolute;top:50%;right:40px;height:560px;z-index:0;pointer-events:none}
  #card .card-char-ghost-1{opacity:.32;transform:translate(26px,-50%) scaleX(-1)}
  #card .card-char-ghost-2{opacity:.16;transform:translate(48px,-50%) scaleX(-1)}
  #card .card-char-ghost-3{opacity:.07;transform:translate(68px,-50%) scaleX(-1)}
  /* Horizontal format: per Eric, the character moves off the right edge
     and into the middle of the layout's own empty space instead -- the
     content column (.content, max-width:900px) sits against the left
     padding, so the genuinely empty area runs from roughly the content's
     right edge to the card's own right padding. Anchored via left:74% +
     translate(-50%,...) (a centered anchor, not a right-edge one) so the
     character and its whole echo trail sit centered in that gap rather
     than pinned to the card's outer edge. */
  body.fmt-horizontal #card .card-char{height:700px;left:74%;right:auto;top:50%;transform:translate(-50%,-50%) scaleX(-1)}
  body.fmt-horizontal #card .card-char-ghost{left:74%;right:auto;top:50%;height:700px}
  body.fmt-horizontal #card .card-char-ghost-1{transform:translate(calc(-50% + 40px),-50%) scaleX(-1)}
  body.fmt-horizontal #card .card-char-ghost-2{transform:translate(calc(-50% + 74px),-50%) scaleX(-1)}
  body.fmt-horizontal #card .card-char-ghost-3{transform:translate(calc(-50% + 104px),-50%) scaleX(-1)}
  #card .content{position:relative;z-index:1;max-width:1020px}
  body:not(.fmt-horizontal) #card .content{max-width:600px;margin-top:64px}
  body.fmt-horizontal #card .content{max-width:900px}
  #card .brand-row{position:absolute;top:60px;left:70px;z-index:1;display:flex;align-items:center;gap:14px}
  body.fmt-horizontal #card .brand-row{top:80px;left:90px}
  #card .brand-row .nlogo{font-family:var(--head);font-weight:800;color:#fff;font-size:26px;letter-spacing:.02em}
  #card .brand-row .nlogo b{color:var(--ne-orange)}
  #card .tag{font-size:22px;padding:.5rem 1.1rem}
  #card h1{font-family:var(--head);font-weight:800;font-size:64px;line-height:1.05;text-transform:uppercase;color:#fff;margin:22px 0 10px;text-shadow:0 4px 24px rgba(0,0,0,.8)}
  body:not(.fmt-horizontal) #card h1{font-size:52px}
  body.fmt-horizontal #card h1{font-size:56px}
  #card .cd-sub{font-family:var(--head);font-weight:600;font-size:28px;color:var(--ne-blue-text);margin:0 0 18px;text-shadow:0 2px 14px rgba(0,0,0,.75)}
  body.fmt-horizontal #card .cd-sub{font-size:24px}
  #card .cd-meta{display:flex;flex-wrap:wrap;gap:.8rem 2rem;margin:.4rem 0 28px}
  #card .cd-meta-item{display:flex;align-items:center;gap:10px;font-family:var(--eu-body);font-weight:600;font-size:24px;color:#dfe4ec;text-shadow:0 1px 8px rgba(0,0,0,.6)}
  #card .cd-meta-item .ic{width:26px;height:26px;color:var(--ne-orange);flex:none}
  #card .prize-heading{font-size:20px;margin:6px 0 16px}
  #card .prize-table{grid-template-columns:repeat(4,1fr);gap:16px;margin:0 0 22px}
  body:not(.fmt-horizontal) #card .prize-table{grid-template-columns:repeat(2,1fr);gap:12px}
  /* Higher-opacity fill than the shared style.css default (rgba(255,255,255,.06)
     bg / .16 border) -- per Eric's "make the prize areas higher opacity"
     request, 2026-09-22 (Round 15). Page-scoped override, same pattern as
     every other #card-prefixed rule in this file. */
  #card .prize-row{flex-direction:column;align-items:flex-start;padding:18px 20px;gap:8px;border-radius:16px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.34)}
  #card .prize-row .place{width:44px;height:44px;font-size:16px}
  #card .prize-row .amt{font-size:34px}
  #card .prize-row .place-label{font-size:15px}
  #card .perk-chip{font-size:22px;padding:.6rem 1.2rem}
  #card .footer-line{margin-top:24px;font-family:var(--eu-body);font-size:20px;color:var(--ink-dim)}
  #err{color:#fff;font-family:var(--eu-body);padding:2rem}
</style>
</head>
<body>
<div id="card" aria-hidden="false">
  <div id="err"></div>
</div>
<script src="assets/js/main.js?v=102"></script>
<script>
(async function(){
  const qs = new URLSearchParams(location.search);
  const fmt = (qs.get('format') || 'square').toLowerCase() === 'horizontal' ? 'horizontal' : 'square';
  document.body.classList.toggle('fmt-horizontal', fmt === 'horizontal');
  const card = document.getElementById('card');

  let data = { events: [] };
  try { data = await (await fetch('data/events.json')).json(); } catch {}
  const events = data.events || [];

  const today = (window.GZ && GZ.todayISO) ? GZ.todayISO() : new Date().toISOString().slice(0,10);
  let ev = null;
  const wantId = qs.get('id');
  if (wantId) ev = events.find(e => e.id === wantId) || null;
  if (!ev) {
    // Default: the next upcoming event that actually has real extra detail
    // on file (an image override and/or prizes/perks) -- "special" events
    // only, per Eric's own framing, not just whatever's chronologically next.
    ev = events
      .filter(e => e.date >= today && (e.image || (e.prizes && e.prizes.length) || (e.perks && e.perks.length)))
      .sort((a,b) => a.date < b.date ? -1 : 1)[0]
      || events.find(e => e.id === 'street-fighter-saturday-slam-2026-09-26')
      || null;
  }

  if (!ev) {
    card.innerHTML = '<div id="err">No matching event found. Pass ?id=&lt;event-id&gt; from data/events.json.</div>';
    return;
  }

  const TYPE = { 'theme-night': 'Theme Day', tournament: 'Tournament', vendor: 'Vendor', edu: 'Training', community: 'Community', major: 'Major' };
  const TYPE_COLOR = { 'theme-night': 'cal-theme', tournament: 'cal-major', vendor: 'cal-amb', edu: 'cal-edu', community: 'cal-amb', major: 'cal-major' };
  const bgUrl = (fmt === 'horizontal' && ev.imageHD) ? ev.imageHD : (ev.image || 'assets/calendar/BGAssets/tournament-major-bg-blurred.jpg');
  const pretty = dt => new Date(dt + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  const esc = (window.GZ && GZ.esc) ? GZ.esc : (s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));

  // "${ord} Place" (e.g. "1st Place") to match calendar.js's own prizeBlock()
  // -- this template had drifted to a bare ordinal with no "Place" word;
  // fixed 2026-09-22 (Round 15) per Eric's "write out 1st place and place
  // for each one".
  const ord = n => (n === 1 ? '1st' : n === 2 ? '2nd' : n === 3 ? '3rd' : `${n}th`);
  const prizeHTML = (ev.prizes && ev.prizes.length)
    ? `<div class="prize-heading">Bracket Prizing</div><div class="prize-table">${ev.prizes.map(p => `<div class="prize-row"><span class="place">${p.place}</span><span><span class="amt">$${p.amount}</span><span class="place-label">${ord(p.place)} Place</span></span></div>`).join('')}</div>`
    : '';
  const perkHTML = (ev.perks && ev.perks.length) ? ev.perks.map(p => `<div class="perk-chip">${esc(p)}</div>`).join('') : '';

  // The real fighter-game character cutout -- rendered in both formats
  // (see the .card-char CSS comment above for the 2026-09-22 sizing
  // history); each format's own CSS rule controls its size/position.
  // Reused as-is from the shared LineupAssets folder, not a one-off copy
  // made just for this card. 3 lower-opacity "ghost" copies of the same
  // image render underneath the main one (see the CSS comment above) --
  // the same echo/fade-trail technique the Weekly Lineup board's per-week
  // theme icon already uses, added 2026-09-22 (Round 15) per Eric's request.
  const CHAR_SRC = 'assets/calendar/LineupAssets/FighterGames.png';
  const charHTML = `
    <img class="card-char-ghost card-char-ghost-3" src="${CHAR_SRC}" alt="" aria-hidden="true">
    <img class="card-char-ghost card-char-ghost-2" src="${CHAR_SRC}" alt="" aria-hidden="true">
    <img class="card-char-ghost card-char-ghost-1" src="${CHAR_SRC}" alt="" aria-hidden="true">
    <img class="card-char" src="${CHAR_SRC}" alt="" aria-hidden="true">`;

  card.innerHTML = `
    <div class="bg-photo" style="background-image:url('${bgUrl}')" aria-hidden="true"></div>
    <div class="bg-scrim" aria-hidden="true"></div>
    ${charHTML}
    <div class="brand-row"><span class="nlogo">NEWEGG <b>GAMER ZONE</b></span></div>
    <div class="content">
      <span class="tag ${TYPE_COLOR[ev.type] || 'cal-major'}">${esc(TYPE[ev.type] || ev.type || 'Event')}</span>
      <h1>${esc(ev.title)}</h1>
      ${ev.subtitle ? `<p class="cd-sub">${esc(ev.subtitle)}</p>` : ''}
      <div class="cd-meta">
        <span class="cd-meta-item"><i data-ic="cal"></i>${pretty(ev.date)}</span>
        ${ev.time ? `<span class="cd-meta-item"><i data-ic="clock"></i>${esc(ev.time)}</span>` : ''}
      </div>
      ${prizeHTML}
      ${perkHTML}
      <div class="footer-line">Free to enter the Zone · Walk-ins welcome</div>
    </div>`;
  if (window.injectIcons) injectIcons(card);
  else if (window.GZ && GZ.injectIcons) GZ.injectIcons(card);
})();
</script>
</body>
</html>
